            return Promise.resolve(
              new Response(JSON.stringify({ success: true, data: { updated: false, html: '' } }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              }),
            );
          }
          return nativeFetch.apply(this, arguments);
        };
